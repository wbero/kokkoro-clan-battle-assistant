name: Update character library

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-character-library
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh character aliases
        shell: bash
        run: |
          python - <<'PY'
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen

          target_file = Path("素材/角色数据.txt")
          url = "https://raw.githubusercontent.com/Ice9Coffee/LandosolRoster/master/_pcr_data.py"

          last_error = None
          for attempt in range(1, 4):
              try:
                  request = Request(url, headers={"User-Agent": "KokkoroCharacterLibraryAction/1.0"})
                  with urlopen(request, timeout=30) as response:
                      text = response.read().decode("utf-8-sig")
                  break
              except Exception as error:
                  last_error = error
                  if attempt == 3:
                      raise
                  print(f"Alias download attempt {attempt} failed: {error}; retrying...")
                  time.sleep(attempt * 3)

          if "CHARA_NAME" not in text:
              raise RuntimeError("Alias source does not contain CHARA_NAME")
          target_file.write_text(text, encoding="utf-8")
          PY

      - name: Run generator unit tests
        run: python -m unittest discover -s tools/tests -p "test_*.py"

      - name: Generate latest CN character library
        run: python tools/generate_character_library.py

      - name: Validate generated library
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("android/app/src/main/assets/characters/character_library.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          characters = payload.get("characters") or []
          source = str(payload.get("databaseSource") or "")

          if payload.get("schemaVersion") != 2:
              raise RuntimeError("Unexpected character library schema")
          if not source.startswith("database-cn-"):
              raise RuntimeError(f"Unexpected database source: {source}")
          if len(characters) < 250:
              raise RuntimeError(f"Character count is suspiciously low: {len(characters)}")
          if any(not (entry.get("ub") or {}).get("name") for entry in characters):
              raise RuntimeError("Generated library contains a character without UB data")

          assets_root = Path("android/app/src/main/assets")
          missing_icons = []
          for entry in characters:
              icon_asset = str(entry.get("iconAsset") or "")
              if not icon_asset.startswith("characters/icons/"):
                  missing_icons.append(f"{entry.get('charaId')}:{icon_asset or '<empty>'}")
                  continue
              if not (assets_root / icon_asset).is_file():
                  missing_icons.append(f"{entry.get('charaId')}:{icon_asset}")
          if missing_icons:
              preview = ", ".join(missing_icons[:10])
              raise RuntimeError(
                  f"Generated library contains {len(missing_icons)} missing portrait(s): {preview}"
              )

          print(f"Validated {len(characters)} characters and portraits from {source}")
          PY

      - name: Commit updated data
        shell: bash
        run: |
          git add -- \
            "素材/角色数据.txt" \
            android/app/src/main/assets/characters/character_library.json \
            android/app/src/main/assets/characters/icons

          if git diff --cached --quiet; then
            echo "Character data is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update character library"
          git pull --rebase origin master
          git push origin HEAD:master
